[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61",
]

[project]
name = "workbench-cli"
version = "0.28.0"
description = "Workbench CLI"
readme = "README.md"
authors = [
  { name = "Matthias Kestenholz", email = "mk@feinheit.ch" },
]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click",
  "pyyaml",
  "requests",
  "rich",
  "tomli-w",
]
scripts.wb = "wb:cli"

[tool.setuptools]
packages = [
  "wb",
]
