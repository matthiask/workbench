{% extends "generic/object_list.html" %}
{% load workbench %}
{% block rows %}
  {% for object in object_list %}
    <a href="{{ object.get_absolute_url }}" class="list-group-item list-group-item-action wb-row">
      <div class="wb-row-main">
        <div class="wb-row-title">{{ object|h }}</div>
        <div class="wb-row-meta"><span>{{ object.created_by }}</span></div>
      </div>
      <div class="wb-row-aside wb-row-meta">{{ object.created_at|local_date_format }}</div>
    </a>
  {% endfor %}
{% endblock rows %}
