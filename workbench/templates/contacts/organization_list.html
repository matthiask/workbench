{% extends "contacts/object_list.html" %}

{% block rows %}
  {% for organization in object_list %}
    <div class="list-group-item wb-row">
      <div class="wb-row-main">
        <a class="wb-row-title" href="{{ organization.get_absolute_url }}">{{ organization }}</a>
        <div class="wb-row-meta d-block">
          {% for person in organization.people.all %}
            <a href="{{ person.get_absolute_url }}">{{ person.full_name }}</a>{% if not forloop.last %},{% endif %}
          {% empty %}&ndash;
          {% endfor %}
        </div>
      </div>
    </div>
  {% endfor %}
{% endblock rows %}
