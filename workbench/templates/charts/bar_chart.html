{% if chart %}
  <figure class="wb-chart">
    <div class="wb-chart-legend">
      {% for item in chart.legend %}
        <span><span class="wb-chart-key wb-chart-key-{{ item.kind }} {{ item.color }}"></span>{{ item.label }}</span>
      {% endfor %}
    </div>
    <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ label }}">
      {% for tick in chart.y_ticks %}
        <line
          class="wb-chart-grid"
          x1="{{ chart.left }}"
          x2="{{ chart.right }}"
          y1="{{ tick.y }}"
          y2="{{ tick.y }}"
        />
        <text
          class="wb-chart-axis"
          x="{{ chart.left|add:-8 }}"
          y="{{ tick.y }}"
          text-anchor="end"
          dominant-baseline="middle"
        >
          {{ tick.label }}
        </text>
      {% endfor %}
      {% for tick in chart.x_ticks %}
        <text class="wb-chart-axis" x="{{ tick.x }}" y="{{ chart.bottom|add:18 }}" text-anchor="middle">
          {{ tick.label }}
        </text>
      {% endfor %}
      {% for column in chart.columns %}
        <rect class="wb-chart-column" x="{{ column.x }}" width="{{ column.width }}" y="0" height="{{ chart.bottom }}">
          <title>{{ column.title }}</title>
        </rect>
      {% endfor %}
      {% for series in chart.bars %}
        <path class="wb-chart-bar {{ series.color }}" d="{{ series.path }}" />
      {% endfor %}
      <line
        class="wb-chart-baseline"
        x1="{{ chart.left }}"
        x2="{{ chart.right }}"
        y1="{{ chart.zero }}"
        y2="{{ chart.zero }}"
      />
      {% for series in chart.lines %}
        <path
          class="wb-chart-line {{ series.color }}{% if series.dashed %} wb-chart-dashed{% endif %}"
          d="{{ series.path }}"
        />
      {% endfor %}
    </svg>
  </figure>
{% endif %}
