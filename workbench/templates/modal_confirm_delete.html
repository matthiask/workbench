{% extends "modalform.html" %}
{% load django_bootstrap5 i18n %}
{% block title %}
  {% blocktranslate trimmed %}
    Delete {{ object }}
  {% endblocktranslate %}
{% endblock title %}

{% block body %}
  {% if form %}{{ block.super }}{% endif %}
{% endblock body %}

{% block footer %}
  <button type="button" data-bs-dismiss="modal" aria-label="Close" class="btn btn-quiet">
    {% translate 'cancel'|capfirst %}
  </button>
  <button type="submit" class="btn btn-danger">{% translate 'delete'|capfirst %}</button>
{% endblock footer %}
