{% extends "projects/object_list.html" %}
{% load i18n workbench %}
{% block rows %}
  {% for campaign in object_list %}
    <a href="{{ campaign.get_absolute_url }}" class="list-group-item list-group-item-action wb-row">
      <div class="wb-row-main">
        <div class="wb-row-title">{{ campaign|h }}</div>
        <div class="wb-row-meta">
          <span>{{ campaign.customer }}</span>
        </div>
      </div>
    </a>
  {% endfor %}
{% endblock rows %}
