{% extends "modal.html" %}
{% load i18n workbench %}
{% block title %}
  {{ object }} {% history_link object %}

{% block body %}
  <dl class="wb-fields">
    {% for name, value in object|field_value_pairs %}
      <dt>{{ name }}</dt>
      <dd>{% link_or_none value %}</dd>
    {% endfor %}
  </dl>
{% endblock body %}

{% block footer %}{% endblock %}
