{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="{% static 'workbench/lib/timestamps.svg' %}">
    <link rel="icon" sizes="192x192" href="{% static 'workbench/lib/timestamps.png' %}">
    <link rel="apple-touch-icon" sizes="192x192" href="{% static 'workbench/lib/timestamps.png' %}">
    <title>Timestamps</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --surface: #fff;
        --text: #1d2127;
        --muted: rgba(29, 33, 39, 0.62);
        --border: #cdd2d9;
        --start: #4257c8;
        --stop: #d63a3a;
        --success: #2f9e6b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --surface: #1a1d23;
          --text: #dfe2e7;
          --muted: rgba(223, 226, 231, 0.6);
          --border: #3a3f49;
          --start: #6b7fe0;
          --stop: #e05a5a;
          --success: #4cc38a;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-flow: column nowrap;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        width: 100%;
        max-width: 30rem;
        margin-inline: auto;
      }

      main > * + * {
        margin-top: 1rem;
      }

      h1 {
        margin: 0;
        font-weight: 600;
        font-size: 1.25rem;
      }

      input {
        display: block;
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--surface);
        color: inherit;
        font: inherit;
        font-size: 1.25rem;
      }

      input::placeholder {
        color: var(--muted);
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .fields [name='notes'] {
        grid-column: 1 / -1;
      }

      .fields input {
        min-width: 0;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      button {
        padding: 1.25rem;
        border: none;
        border-radius: 0.75rem;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 1.5rem;
        cursor: pointer;
      }

      button:active {
        opacity: 0.8;
      }

      [data-type='start'] {
        background: var(--start);
      }

      [data-type='stop'] {
        background: var(--stop);
      }

      #status {
        min-height: 1.5rem;
        color: var(--stop);
        text-align: center;
      }

      #status.success {
        color: var(--success);
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const $ = (sel, base=document) => base.querySelector(sel)

        const notes = $("[name=notes]")
        const time = $("[name=time]")
        const project = $("[name=project]")

        let statusTimeout = null
        const setStatus = (success, message = "") => {
          clearTimeout(statusTimeout)

          const f = $("#status")
          f.textContent = message
          f.classList.toggle("success", success)

          statusTimeout = setTimeout(() => {
            f.textContent = ""
            f.classList.remove("success")
          }, success ? 2000 : 6000)
        }

        const params = new URLSearchParams(window.location.search)
        const url = params.get("url")
        const token = params.get("token")
        const title = params.get("title")

        if (!token || !url) {
          alert("Necessary configuration parameters missing.")
        }

        if (title) {
          document.title += `: ${title}`
          $("h1").textContent += `: ${title}`
        }

        document.body.addEventListener("click", async e => {
          const button = e.target.closest("button[data-type]")

          if (button) {
            const fd = new FormData()
            fd.append("type", button.dataset.type)
            fd.append("notes", notes.value)
            fd.append("time", time.value)
            fd.append("project", project.value)
            fd.append("token", token)
            try {
              const response = await fetch(`${url}`, {
                method: "POST",
                body: fd,
              })
              const data = await response.json()
              if (!response.ok) {
                const errors = JSON.parse(data.errors)
                throw Error(
                  Object.values(errors).flat().map(e => e.message).join(" ")
                )
              }

              notes.value = ""
              time.value = ""
              project.value = ""
              setStatus(true, "Saved!")
            } catch(err) {
              setStatus(false, `${err}`)
            }
          }
        })
      })
    </script>
  </head>
  <body>
    <main>
      <h1>Timestamps</h1>
      <div class="fields">
        <input type="text" name="notes" value="" placeholder="Notes">
        <input type="time" name="time" value="" placeholder="Time">
        <input type="text" name="project" value="" placeholder="Project">
      </div>
      <div class="buttons">
        <button type="button" data-type="start">Start</button>
        <button type="button" data-type="stop">Stop</button>
      </div>
      <div id="status"></div>
    </main>
  </body>
</html>
